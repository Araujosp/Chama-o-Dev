<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="style-login.css">
    <title>Login | Chama Dev</title>
    <link rel="icon" href="IMG/icon_chama_o_dev.png" type="image/png">
</head>

<body>
    <img src="IMG/chama_o_dev-removebg-preview.png">
    <div class="box">
        <h1>Login</h1>

        <form action="./areaCliente/projeto.html">
            <div class="login-label">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Digite seu email">
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" placeholder="Digite sua senha">
                </div>
            </div>

            <div class="extra-links">
                <label>
                    <input type="checkbox" id="relembra"> Relembra-me
                </label>
                <a href="#">Esqueceu a Senha ?</a>
            </div>

            <div class="btn">
                <input type="submit" value="Enviar">
            </div>
        </form>
    </div>

</body>
</html>
