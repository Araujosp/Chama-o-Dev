<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style-areaCliente.css">
    <link rel="icon" href="../IMG/icon_chama_o_dev.png" type="image/png">
</head>
<body>
    <aside class="menu_lateral">
        <img src="../IMG/chama_o_dev-removebg-preview.png" alt="logotipo_chamaDev">
        <nav>
            <ul class="lista_menu_lateral">
                <li class="option_menu_lateral"><a href="projeto.html"><img src="../icons/analytics (1).png" alt="icone_dashboard"> Projetos</li></a>
                <li class="option_menu_lateral"><a href="suporte.html"><img src="../icons/icons8-comentários-100.png" alt="icone_balao"> Suporte</li></a>
                <li class="option_menu_lateral"><a href="configuracao.html"><img src="../icons/Setting_fill (1).png" alt="icon_settings"> Configurações</li></a>
            </ul>
            <div class="saida_menu_lateral">
                <a href="../login.html"><img src="../icons/icons8-sair-96.png" alt="icone_saida"> Sair</a>
            </div>
        </nav>
    </aside>
    <main>
        <div class="menu_horizontal">
            <h1 class="titulo_menu_lateral">Configuração</h1>
            <h2 class="subtitulo_menu_horizontal">Bem Vindo, Usuário 👋</h2>
            <img src="../icons/Bell_pin_fill.png" alt="icone_sino" class="icons_menu_horizontal">
            <div class="icone_usuario">
                <h1>RS</h1>
            </div>
        </div>
        <section class="area_conteudo">
            <div class="perfil_usuario">
                <h1>perfil</h1>
                <div class="dados_usuario">
                    <div class="icone_usuario">RS</div>
                    <h2 class="nome_usuario">Roberivan Santos</h2>
                    <h3 class="cargo_usuario">Diretor de Marketing - Oscorp Brasil</h3>
                </div>
                <form action="">
                    <label for="" class="informations_usuario">Nome</label>
                    <input type="text" class="campo_informacoes_usuario" placeholder="Insira seu nome">
                    <label for="" class="informations_usuario">Telefone</label>
                    <input type="tel" class="campo_informacoes_usuario" placeholder="Insira seu telefone">
                    <label for="" class="informations_usuario">E-mail</label>
                    <input type="email" class="campo_informacoes_usuario" placeholder="Adicione seu e-mail">
                    <label for="" class="informations_usuario">Empresa</label>
                    <input type="text" class="campo_informacoes_usuario" placeholder="Adicione o nome da empresa">
                    <input type="submit" class="btn_salvar" value="Salvar Alterações">  
                </form>
            </div>
            <div class="campo_seguranca">
                <h1>Segurança</h1>
                <form action="">
                    <label for="" class="informacoes_usuario">Senha Atual</label>
                    <input type="password" class="campo_informacoes_usuarios">
                    <label for="" class="informacoes_usuario">Nova Senha</label>
                    <input type="password" class="campo_informacoes_usuarios">
                    <input type="submit" class="btn_salvar" value="Alterar Senha">
                </form>
            </div>
        </section>
    </main>
</body>
</html>
