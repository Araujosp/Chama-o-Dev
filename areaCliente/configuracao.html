<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style-areaCliente.css">
    <link rel="icon" href="../IMG/icon_chama_o_dev.png" type="image/png">
</head>
<body>
    <aside class="menu_lateral">
        <img src="../IMG/chama_o_dev-removebg-preview.png" alt="logotipo_chamaDev" class="logotipo_menu_lateral">
        <div class="linha_menu_lateral"></div>
        <nav>
            <a href="projeto.html"><img src="../icons/analytics (1).png" alt="icone_dashboard" class="icons_menu_lateral"> Projetos</a>
            <a href="suporte.html"><img src="../icons/icons8-comentários-100.png" alt="icone_balao" class="icons_menu_lateral"> Suporte</a>
            <a href="configuracao.html"><img src="../icons/Setting_fill (1).png" alt="icon_settings" class="icons_menu_lateral"> Configurações</a>
            <a href="../login.html"><img src="../icons/icons8-sair-96.png" alt="icone_saida" class="icons_menu_lateral">Sair</a>
        </nav>
    </aside>
    <main>
        <div class="menu_horizontal">
            <div class="menu_informacoes">
                <h1 class="titulo_menu_lateral">Configuração</h1>
                <h2 class="subtitulo_menu_horizontal">Bem Vindo, Allan 👋</h2>
            </div>
            <div class="menu_icones">
                <img src="../icons/Bell_pin_fill.png" alt="icone_sino" class="icons_menu_horizontal">
                <div class="icone_usuario_horizontal">AL</div>
            </div>
        </div>
        <section class="area_conteudo">
            <div class="perfil_usuario">
                <h1 class="titulos_usuario">Perfil</h1>
                <div class="dados_usuario">
                    <div class="icone_usuario">AL</div>
                    <div class="informacoes_perfil">
                        <h2 class="nome_usuario">Allan Santos</h2>
                        <h3 class="cargo_usuario">Diretor de Marketing - Oscorp Brasil</h3>
                    </div>
                </div>
                <div class="formularios_usuario">
                    <form action="">
                        <label for="" class="informations_usuario">Nome</label>
                        <input type="text" class="campo_informacoes_usuario" placeholder="Insira seu nome">
                        <label for="" class="informations_usuario">Telefone</label>
                        <input type="tel" class="campo_informacoes_usuario" placeholder="Insira seu telefone">
                    </form>
                    <form action="">
                        <label for="" class="informations_usuario">E-mail</label>
                        <input type="email" class="campo_informacoes_usuario" placeholder="Adicione seu e-mail">
                        <label for="" class="informations_usuario">Empresa</label>
                        <input type="text" class="campo_informacoes_usuario" placeholder="Adicione o nome da empresa">
                        <input type="submit" class="btn_salvar salvar_alteracao" value="Salvar Alterações"> 
                    </form>
                </div>
            </div>
            <div class="campo_seguranca perfil_usuario">
                <h1 class="titulos_usuario">Segurança</h1>
                <div class="formulario_senha">
                    <form action="">
                        <label for="" class="informacoes_usuario">Senha Atual</label>
                        <input type="password" class="campo_informacoes_usuario" placeholder="●●●●●●●●">
                    </form>
                    <form action="">
                        <label for="" class="informacoes_usuario">Nova Senha</label>
                        <input type="password" class="campo_informacoes_usuario" placeholder="●●●●●●●●">
                    </form>
                </div>
                <input type="submit" class="btn_salvar" value="Alterar Senha">
            </div>
        </section>
    </main>
</body>
</html>
