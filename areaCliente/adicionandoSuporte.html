<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte | Chama o Dev</title>
    <link rel="stylesheet" href="../style-areaCliente.css">
    <link rel="icon" href="../IMG/icon_chama_o_dev.png" type="image/png">
</head>

<body>
    <aside class="menu_lateral">
        <a href="../index.html"><img src="../IMG/chama_o_dev-removebg-preview.png" alt="logotipo_chamaDev" class="logotipo_menu_lateral"></a>
        <div class="linha_menu_lateral"></div>
        <nav>
            <a href="projeto.html"><img src="../icons/analytics (1).png" alt="icone_dashboard"
                    class="icons_menu_lateral"> Projetos</a>
            <a href="suporte.html"><img src="../icons/icons8-comentários-100.png" alt="icone_balao"
                    class="icons_menu_lateral"> Suporte</a>
            <a href="configuracao.html"><img src="../icons/Setting_fill (1).png" alt="icon_settings"
                    class="icons_menu_lateral"> Configurações</a>
            <a href="../login.html"><img src="../icons/icons8-sair-96.png" alt="icone_saida"
                    class="icons_menu_lateral">Sair</a>
        </nav>
    </aside>
    <main>
        <div class="menu_horizontal">
            <div class="menu_informacoes">
                <h1 class="titulo_menu_lateral">Suporte</h1>
                <h2 class="subtitulo_menu_horizontal">Bem Vindo, Allan 👋</h2>
            </div>
            <div class="menu_icones">
                <div class="image_content">
                    <img src="../icons/Bell_pin_fill.png" alt="icone_sino" class="icons_menu_horizontal">
                    <div class="notificacoes">
                        <p>Você não tem notificações</p>
                    </div>
                </div>
                <div class="icone_usuario_horizontal"><a href="configuracao.html">AL</a></div>
            </div>
        </div>
        <section class="suporte_solicitacao area_conteudo">
            <div class="solicitacao_suporte">
                <div class="titulo_subtitulo">
                    <h1>Abrir Nova Solicitação</h1>
                    <h2>Preencha os campos abaixo para enviar sua solicitação ao suporte.</h2>
                </div>
                <div class="campo_form_suporte">
                    <div class="campo_solicitacao">
                        <form action="">
                            <label for="">Assunto</label>
                            <input type="text" placeholder="Ex: Erro ao acessar Relatórios">
                        </form>
                        <form action="">
                            <label for="">Categoria</label>
                            <select class="suporte_content">
                                <option value="">Bug/Erro</option>
                                <option value="">Nova Funcionalidade</option>
                                <option value="">Dúvida</option>
                                <option value="">Outros</option>
                            </select>
                        </form>
                    </div>
                    <form action="" class="descricao_suporte_solicitacao">
                        <label for="" class="descricao_solicitacao">Descrição</label>
                        <input type="text" placeholder="Descreva detalhadamento o problema ou solicitação ...">
                    </form>
                </div>
                <div class="btn_suporte">
                    <a href="suporte.html" class="voltar_solicitacao"><img src="../icons/seta-esquerda.png" alt="" class="icon_solicitacao_suporte">Voltar</a>
                    <a href="respostaSuporte.html" class="enviar_ticket"><img src="../icons/mandar.png" alt="" class="icon_solicitacao_suporte">Enviar Ticket</a>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
