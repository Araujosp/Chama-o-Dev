<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sytle-servicos.css">
    <title>Orçamento | Chama o Dev</title>
    <link rel="icon" href="IMG/icon_chama_o_dev.png">
</head>

<body>

<header class="menu">
    <img src="IMG/chama_o_dev-removebg-preview.png" class="logo-navbar">
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="#">Serviços</a>
        <a href="nossaequipe.html">Nossa Equipe</a>
        <a href="contato.html">Fale Conosco</a>
    </nav>
</header>

<div class="orcamento-container">

    <h1 class="titulo"><span>ORÇAMENTO</span> CHAMA O DEV</h1>
    <p class="sub-title">Solicite um orçamento para seu projeto</p>

    <form class="orcamento-form">

        <label>Nome</label>
        <input type="text" placeholder="Digite seu nome">

        <label>Email</label>
        <input type="email" placeholder="Digite seu email">

        <label>Telefone</label>
        <input type="tel" placeholder="(11) 99999-9999">

        <label>Tipo de Serviço</label>
        <select>
            <option>Criação de Site</option>
            <option>Landing Page</option>
            <option>Manutenção de Site</option>
            <option>Sistema Web</option>
        </select>

        <label>Descrição do Projeto</label>
        <textarea placeholder="Explique seu projeto..."></textarea>

        <div class="btn">
            <input type="submit" value="Solicitar Orçamento">
        </div>

    </form>

</div>

</body>
</html>
